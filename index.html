<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyArc — выбор даты и времени</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --page-bg: #e6e7ea;
    --panel-bg: rgba(34, 35, 38, 0.84);
    --accent: #ffbb00;
    --muted: #dddddd;
    --on-accent: #000000;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page-bg: #101113; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --page-bg: #101113; color-scheme: dark; }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%;
    background: var(--page-bg);
    font-family: "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center;
    overflow: hidden;
  }

  /* Phone frame: 393 × 852 as in Figma; full-screen on phones */
  .stage {
    position: relative;
    width: 393px; height: 852px;
    border-radius: 54px;
    overflow: hidden;
    transform-origin: center;
    background:
      linear-gradient(180deg, #1f5fae 0%, #3f7fc6 38%, #8fb0cf 58%, #b9a98f 72%, #5d5143 86%, #2b2a27 100%);
  }
  @media (max-width: 500px) {
    body { display: block; }
    .stage {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      width: auto; height: auto;
      border-radius: 0;
      transform: none !important;
      padding-top: env(safe-area-inset-top, 0px);
    }
  }

  /* Live sun path overlay, recomputed every frame */
  .sky {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  /* Drag on the sky: look around (no sensors) or fine-tune the compass (with sensors) */
  .look { position: absolute; inset: 0; touch-action: none; cursor: grab; }
  /* Hour bubbles next to the trajectory dots */
  .hour-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .hour-label {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: flex-end; gap: 2px;
    padding: 1px 7px 3px;
    border-radius: 26px;
    background: #dddddd;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: #222326;
    font: 500 14px/18px "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
    white-space: nowrap;
    will-change: transform;
    transition: opacity .15s ease;
  }
  /* Bubbles along the arc: hide and show near the sun with a 0.2 s fade */
  .hour-label:not(.sun-time) { transition: opacity .2s ease; }
  .hour-label.is-covered, .hour-label.is-moving { opacity: 0; }
  /* Exact selected time next to the sun */
  .hour-label.sun-time { background: #FFBB00; color: #000; }
  .picker, .cam-btn, .status { z-index: 2; }
  .status {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(62px + env(safe-area-inset-top, 0px));
    width: max-content; max-width: calc(100% - 40px);
    margin: 0; padding: 10px 16px;
    border-radius: 18px;
    background: var(--panel-bg);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: #fff; font: 500 14px/1.3 "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-align: center; pointer-events: none;
  }
  .status[hidden] { display: none; }
  @media (min-width: 501px) { .status { top: 62px; } }

  /* Live camera as the background */
  .cam, .tint { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cam { object-fit: cover; opacity: 0; transition: opacity .4s ease; background: transparent; }
  .stage.has-cam .cam { opacity: 1; }
  .tint { background: rgba(0, 0, 0, 0.3); pointer-events: none; }
  .cam-btn {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(62px + env(safe-area-inset-top, 0px));
    max-width: calc(100% - 40px);
    padding: 10px 18px;
    border: 0; border-radius: 26px;
    background: var(--panel-bg);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: #fff; font: 600 16px/1.2 "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-align: center; cursor: pointer;
  }
  .cam-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .cam-btn[disabled] { cursor: default; color: var(--muted); }
  .stage.ar-on .cam-btn { display: none; }
  @media (min-width: 501px) { .cam-btn { top: 62px; } }

  /* Calendar block */
  .picker {
    position: absolute;
    left: 50%; width: 237px; margin-left: -118.5px;
    bottom: 65px;
    height: 176px;
    border-radius: 26px;
    background: var(--panel-bg);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  @media (max-width: 500px) {
    .picker { bottom: calc(65px + env(safe-area-inset-bottom, 0px)); }
  }

  .row {
    position: absolute; left: 0; right: 0;
  }
  .row--time  { top: 10px;  height: 60px; }
  .row--day   { top: 72px;  height: 46px; }
  .row--month { top: 120px; height: 46px; }

  .strip {
    position: absolute; inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
  }
  .track {
    position: relative; height: 100%;
    will-change: transform;
  }
  .strip::-webkit-scrollbar { display: none; }
  .strip.is-dragging { cursor: grabbing; }
  .strip:focus-visible { outline: none; }
  .row:has(.strip:focus-visible) .pill { box-shadow: 0 0 0 2px #fff; }

  .item {
    position: absolute; top: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    scroll-snap-align: center;
    color: var(--muted);
    font-weight: 500;
    text-align: center;
    white-space: nowrap;
  }
  .row--time  .item { width: 29px; height: 100%; }
  .row--day   .item, .row--month .item { width: 44px; height: 100%; }

  .t-num  { font-size: 18px; line-height: 18px; margin-bottom: -4px; }
  .t-sub  { font-size: 12px; line-height: 18px; }
  .t-dot  { width: 2.021px; height: 1.951px; display: block; }
  .d-num  { font-size: 18px; line-height: normal; }
  .m-name { font-size: 16px; font-weight: 600; line-height: normal; }

  /* Red selection stays fixed; the strip scrolls underneath it */
  .pill {
    position: absolute; top: 0; left: 50%;
    width: 46px; height: 100%;
    margin-left: -23px;
    border-radius: 66px;
    background: var(--accent);
    color: var(--on-accent);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    font-weight: 500; text-align: center; white-space: nowrap;
    overflow: hidden;
  }
  .pill--time { gap: 2px; overflow: hidden; }
  /* Inside the time pill: its own strip of large hours, moving with the time strip and clipped by the pill */
  .pill-track { position: absolute; inset: 0; }
  .pt-item {
    position: absolute; left: 50%; top: 50%;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: #000; font-weight: 500; white-space: nowrap;
    will-change: transform;
  }
  .p-num   { font-size: 28px; line-height: 18px; }
  .p-sub   { font-size: 16px; line-height: 18px; }
  .p-month { font-size: 24px; line-height: normal; letter-spacing: -0.96px; }

  @media (prefers-reduced-motion: reduce) {
    .strip { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <video class="cam" id="cam" playsinline muted autoplay aria-hidden="true"></video>
    <div class="tint" aria-hidden="true"></div>
    <button class="cam-btn" id="camBtn" type="button">Включить камеру и датчики</button>
    <p class="status" id="status" role="status" hidden></p>
    <svg class="sky" id="sky" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="miniGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="1.35"/>
        </filter>
        <filter id="sunGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
        <mask id="pathMask" maskUnits="userSpaceOnUse" x="-10000" y="-10000" width="20000" height="20000">
          <rect x="-10000" y="-10000" width="20000" height="20000" fill="#fff"/>
          <circle id="maskHole" r="37.5" cx="-999" cy="-999" fill="#000"/>
          <g id="dotHoles" fill="#000"></g>
        </mask>
      </defs>
      <path id="sunPath" mask="url(#pathMask)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="hourDots"></g>
      <g id="sunMark" visibility="hidden">
        <circle r="32.5" fill="#FFFFFF" filter="url(#sunGlow)"/>
        <circle r="18.5" fill="#FFBB00"/>
      </g>
      <g id="sunEdge" visibility="hidden">
        <circle r="6.27" fill="#FFFFFF" filter="url(#miniGlow)"/>
        <circle r="3.57" fill="#FFBB00"/>
      </g>
    </svg>
    <div class="hour-labels" id="hourLabels" aria-hidden="true"></div>
    <div class="look" id="look" aria-hidden="true"></div>

    <section class="picker" aria-label="Дата и время">
      <div class="row row--time">
        <div class="strip" id="timeStrip" tabindex="0" role="slider" aria-label="Время суток"></div>
        <div class="pill pill--time" aria-hidden="true">
          <div class="pill-track" id="pillTrack"></div>
        </div>
      </div>
      <div class="row row--day">
        <div class="strip" id="dayStrip" tabindex="0" role="slider" aria-label="Число"></div>
        <div class="pill" aria-hidden="true"><div class="pill-track" id="dayTrack"></div></div>
      </div>
      <div class="row row--month">
        <div class="strip" id="monthStrip" tabindex="0" role="slider" aria-label="Месяц"></div>
        <div class="pill" aria-hidden="true"><div class="pill-track" id="monthTrack"></div></div>
      </div>
    </section>
  </main>

  // ---------- The whole year 2026 ----------

    MONTH_START.push(TOTAL_DAYS);

  let wantedDom = 1;     // the day number the person chose; kept when months change
  let monthJump = false; // true while the month strip repositions the days

  const pillTrack = document.getElementById("pillTrack");
  const time = new Carousel(timeStrip, 29, i => {

  // Exact time of day as "7:44" + "AM"

  // so this strip moves slower than the time strip while staying in sync with it
  const PILL_HOUR = 43.5;
  function updateTimePill(pos) {

  // Inside a day or month pill: its own strip of large values that moves exactly with the small

  function pillStrip(trackEl, c, html) {

      el.className = "pt-item";

      const base = Math.round(pos / c.step);

        const x = i * c.step - pos;

        if (el.dataset.i !== String(i)) { el.innerHTML = html(i); el.dataset.i = String(i); }
        el.style.transform = "translate(calc(-50% + " + x.toFixed(2) + "px), -50%)";
      }

  }

  // The time strip looks like an endless 24-hour loop: changing the date elsewhere

  let xfTimer = 0;
  function crossfadeSky() {
    const live = [document.getElementById("sky"), document.getElementById("hourLabels")];

  // ---------- Initial state from the mockup: 07 am, 19 Feb 2026 ----------

  function init() {

  const stageEl = document.getElementById("stage");
  const skyEl = document.getElementById("sky");
  const pathEl = document.getElementById("sunPath");
  const dotsEl = document.getElementById("hourDots");
  const sunEl = document.getElementById("sunMark");
  const edgeEl = document.getElementById("sunEdge");
  const holeEl = document.getElementById("maskHole");
  const dotHolesEl = document.getElementById("dotHoles");

  function magneticDeclination(lat, lon) {

  let statusTimer = 0;
  function showStatus(text, ms) {
    statusEl.textContent = text;

  }

  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

  function sunPosition(date, lat, lon) {

    const M = RAD * (357.5291 + 0.98560028 * d);
    const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));

  function selectedDate() {

  }

  // Continuous time for the sun: follows the time strip's exact scroll position, not just the snapped value
  function sunDate() {

    const d = Math.floor(steps / 48);

  // Sun's declination and hour angle at a moment (same ephemeris as sunPosition)
  function sunEquatorial(date, lon) {
    const d = date.getTime() / 864e5 - 0.5 + 2440588 - 2451545;
    const M = RAD * (357.5291 + 0.98560028 * d);
    const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    const L = M + C + RAD * 102.9372 + Math.PI;
    const e = RAD * 23.4397;
    const dec = Math.asin(Math.sin(e) * Math.sin(L));
    const ra = Math.atan2(Math.sin(L) * Math.cos(e), Math.cos(L));

  // Hour angle advances 15° per hour, so 24 h close the circle: the path passes exactly through
  // the sun and morphs continuously while the time strip moves — no jump at midnight, because
  // 00:00 of the next day lands on the same spot as 24:00 of the previous one.
  let pathKey = "", pathPts = [], hourPts = [], eventPts = [];
  function computePath() {
    const t = sunDate();
    const steps = Math.max(0, Math.min(time.count - 1, time.pos / time.step));
    const minOfDay = (steps % 48) * 30;

      const az = Math.atan2(Math.sin(H), Math.cos(H) * sP - tD * cP) + Math.PI;

        for (let k = 0; k < 14; k++) {

        eventPts.push({ v, va: toVec(at((lo + hi) / 2 - 3)), vb: toVec(at((lo + hi) / 2 + 3)), min: (lo + hi) / 2, label: fmtTime((lo + hi) / 2) });
      }
      pathPts.push({ v: toVec(p), up });
      prev = { up };
      // Every half hour gets a dot (also before sunrise and after sunset); full hours get a bubble
      if (min % 30 === 0 && min < 1440) {
        const h = min / 60;
        hourPts.push({ v: toVec(p), va: toVec(at(min - 3)), vb: toVec(at(min + 3)), up, h, min, label: min % 60 === 0 ? [String(hour12(h)), ampm(h).toUpperCase()] : null });
      }
    }
    // The dot closest to sunrise or sunset (whichever half hour it is) gets no hour bubble:
    // the sunrise/sunset time bubble takes its place. If that dot is a half hour, nothing is hidden.
    for (const e of eventPts) {
      let near = null;
      for (const hp of hourPts) if (!near || Math.abs(hp.min - e.min) < Math.abs(near.min - e.min)) near = hp;
      if (near) near.label = null;
    }
  }

  // Does the drawn line pass through a bubble? (ignores the gap the line leaves around its own dot)
  function rectHitsLine(rx, ry, w, h, dotX, dotY, segs, m = 8, exclR = 7.5) {
    // m = minimum clearance between a bubble and the line
    const x0 = rx - m, y0 = ry - m, x1 = rx + w + m, y1 = ry + h + m;
    for (const s of segs) {
      if (Math.max(s[0], s[2]) < x0 || Math.min(s[0], s[2]) > x1 || Math.max(s[1], s[3]) < y0 || Math.min(s[1], s[3]) > y1) continue;
      const n = Math.max(1, Math.ceil(Math.hypot(s[2] - s[0], s[3] - s[1]) / 2));

        if (Math.hypot(px - dotX, py - dotY) < exclR) continue;
        if (px >= x0 && px <= x1 && py >= y0 && py <= y1) return true;
      }

  function frame() {

    // Pinhole camera matched to the video as it is shown (object-fit: cover)

    const f = (Math.max(vw, vh) / 2) / Math.tan(FOV_LONG / 2) * Math.max(W / vw, H / vh);

    // Yellow dots that would sit closer than 2 px (edge to edge) to a sunrise/sunset dot are dropped
    const evQ = eventPts.map(ev => proj(ev.v)).filter(Boolean);
    for (const hp of hourPts) {
      const q = proj(hp.v);
      if (!q) continue;
      if (evQ.some(e => Math.hypot(e[0] - q[0], e[1] - q[1]) < 2.5 + 2.5 + 2)) continue;
      const x = q[0].toFixed(1), y = q[1].toFixed(1);
      dots += '<circle cx="' + x + '" cy="' + y + '" r="2.5" fill="#FFBB00"/>';
      if (hp.up) holes += '<circle cx="' + x + '" cy="' + y + '" r="7"/>';
      if (hp.label) bubbles[hp.h] = { q, qa: proj(hp.va), qb: proj(hp.vb), label: hp.label };
    }
    // Sunrise and sunset: white dot where the arc ends, with the exact time
    eventPts.forEach((ev, k) => {
      const q = proj(ev.v);
      if (!q) return;
      const x = q[0].toFixed(1), y = q[1].toFixed(1);
      dots += '<circle cx="' + x + '" cy="' + y + '" r="2.5" fill="#FFFFFF"/>';
      holes += '<circle cx="' + x + '" cy="' + y + '" r="7"/>';
      if (k < 2) bubbles[24 + k] = { q, qa: proj(ev.va), qb: proj(ev.vb), label: ev.label };
    });
    dotsEl.innerHTML = dots;
    dotHolesEl.innerHTML = holes;

    const sp = sunPosition(sunDate(), ar.lat, ar.lon);
    const sv = toVec(sp), sq = proj(sv);
    const onScreen = !!sq && sq[0] > -20 && sq[0] < W + 20 && sq[1] > -20 && sq[1] < H + 20;
    if (onScreen) {
      sunEl.setAttribute("transform", "translate(" + sq[0].toFixed(1) + " " + sq[1].toFixed(1) + ")");
      holeEl.setAttribute("cx", sq[0].toFixed(1)); holeEl.setAttribute("cy", sq[1].toFixed(1));
    } else {
      holeEl.setAttribute("cx", "-999"); holeEl.setAttribute("cy", "-999");
    }
    sunEl.setAttribute("visibility", onScreen ? "visible" : "hidden");

    // Hour bubbles: each hour always uses its own element, so its chosen side is remembered per hour
    const shownRects = [];
    for (let i = 0; i < labelEls.length; i++) {
      const el = labelEls[i], b = bubbles[i];
      if (!b || b.q[0] < -80 || b.q[0] > W + 10 || b.q[1] < -40 || b.q[1] > H + 10) {
        if (el.style.display !== "none") el.style.display = "none";
        el._shown = null; el._fadeUntil = 0; el.classList.remove("is-moving");
        continue;
      }
      const text = b.label[0] + " " + b.label[1];
      if (el.style.display === "none") el.style.display = "";
      if (el.dataset.t !== text) {
        el.innerHTML = "<span>" + b.label[0] + "</span><span>" + b.label[1] + "</span>";
        el.dataset.t = text;
        el._w = el.offsetWidth; el._h = el.offsetHeight;
      }
      // Always below the arc, square to it: the bubble sits on the line's normal that points down
      // the screen, with its nearest edge 8 px from the dot. It turns smoothly around its dot as the
      // arc tilts, never jumps, and never crosses the line (drawn or not, below the horizon).
      const w = el._w, h = el._h, dx = b.q[0], dy = b.q[1];
      let tx = 1, ty = 0;
      if (b.qa && b.qb) { tx = b.qb[0] - b.qa[0]; ty = b.qb[1] - b.qa[1]; }
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      let nx = -ty, ny = tx;
      if (ny < 0) { nx = -nx; ny = -ny; }
      // Nearly vertical arc: "below" is ambiguous, so keep the side it already has
      if (el._n && Math.abs(ny) < 0.25 && nx * el._n[0] + ny * el._n[1] < 0) { nx = -nx; ny = -ny; }
      el._n = [nx, ny];
      const reach = 8 + Math.abs(nx) * w / 2 + Math.abs(ny) * h / 2;
      const lx = dx + nx * reach - w / 2, ly = dy + ny * reach - h / 2;
      el.style.transform = "translate(" + lx.toFixed(1) + "px," + ly.toFixed(1) + "px)";
      // Hide when the sun's disc comes within 20 pt of the bubble, show again when it moves further
      // away; the switch fades over 0.2 s (distance from the white disc's edge to the bubble)
      let fade = 1;
      if (onScreen) {
        const nx = Math.max(lx, Math.min(sq[0], lx + el._w));
        const ny = Math.max(ly, Math.min(sq[1], ly + el._h));
        const gapToSun = Math.hypot(sq[0] - nx, sq[1] - ny) - 18.5;
        fade = gapToSun > 20 ? 1 : 0;
      }
      el.classList.remove("is-covered");
      el.style.opacity = fade.toFixed(3);
      if (fade > 0) shownRects.push({ el, x: lx, y: ly, w: el._w, h: el._h });
    }

    // Exact selected time next to the sun: below-right by default (as in the mockup); otherwise
    // above-right, below-left, above-left — never on top of an hour bubble, and off the line if possible
    if (onScreen) {
      const t = fmtTime(((Math.max(0, time.pos / time.step)) % 48) * 30);
      const text = t[0] + " " + t[1];
      if (sunTimeEl.style.display === "none") sunTimeEl.style.display = "";
      if (sunTimeEl.dataset.t !== text) {
        sunTimeEl.innerHTML = "<span>" + t[0] + "</span><span>" + t[1] + "</span>";
        sunTimeEl.dataset.t = text;
        sunTimeEl._w = sunTimeEl.offsetWidth; sunTimeEl._h = sunTimeEl.offsetHeight;
      }
      const w = sunTimeEl._w, h = sunTimeEl._h, sx = sq[0], sy = sq[1];
      const spots = [[sx + 28.5, sy + 30.5], [sx + 28.5, sy - 30.5 - h], [sx - 28.5 - w, sy + 30.5], [sx - 28.5 - w, sy - 30.5 - h]];
      const hitsBubble = s => shownRects.some(r => spots[s][0] < r.x + r.w + 4 && spots[s][0] + w > r.x - 4 && spots[s][1] < r.y + r.h + 4 && spots[s][1] + h > r.y - 4);
      const hitsLine = s => rectHitsLine(spots[s][0], spots[s][1], w, h, sx, sy, segs, 4, 37.5);
      const ok = s => !hitsBubble(s) && !hitsLine(s);
      let pick = -1;
      if (sunTimeEl._spot != null && ok(sunTimeEl._spot)) pick = sunTimeEl._spot;
      if (pick < 0) for (let s = 0; s < 4; s++) if (ok(s)) { pick = s; break; }
      if (pick < 0) for (let s = 0; s < 4; s++) if (!hitsBubble(s)) { pick = s; break; }
      if (pick < 0) pick = sunTimeEl._spot != null ? sunTimeEl._spot : 0;
      sunTimeEl._spot = pick;
      const lx = spots[pick][0], ly = spots[pick][1];
      sunTimeEl.style.transform = "translate(" + lx.toFixed(1) + "px," + ly.toFixed(1) + "px)";
      // If no spot was free of hour bubbles, the hour bubbles underneath step aside
      for (const r of shownRects) {
        if (lx < r.x + r.w + 4 && lx + w > r.x - 4 && ly < r.y + r.h + 4 && ly + h > r.y - 4) r.el.style.opacity = "0";
      }
    } else if (sunTimeEl.style.display !== "none") {
      sunTimeEl.style.display = "none";
    }

    // Sun out of view: a small sun at the edge of the screen, on the side toward the real one
    // (left or right of the calendar panel, or below it)
    if (!onScreen) {
      const r = raw(sv);
      let ux = r[0], uy = -r[1];
      const l = Math.hypot(ux, uy);
      if (l < 1e-6) { ux = 0; uy = 1; } else { ux /= l; uy /= l; }
      const m = 10;
      const tx = Math.abs(ux) > 1e-6 ? ((ux > 0 ? W - m : m) - cx) / ux : Infinity;
      const ty = Math.abs(uy) > 1e-6 ? ((uy > 0 ? H - m : m) - cy) / uy : Infinity;
      const t = Math.min(tx, ty);
      edgeEl.setAttribute("transform", "translate(" + (cx + ux * t).toFixed(1) + " " + (cy + uy * t).toFixed(1) + ")");
      edgeEl.setAttribute("visibility", "visible");
    } else {
      edgeEl.setAttribute("visibility", "hidden");
    }
    requestAnimationFrame(frame);
  }

  // Drag the sky: look around without sensors, or correct the compass with them
  let lookDrag = null;
  lookEl.addEventListener("pointerdown", e => { lookDrag = { x: e.clientX, y: e.clientY }; lookEl.setPointerCapture(e.pointerId); });
  lookEl.addEventListener("pointermove", e => {
    if (!lookDrag) return;
    const dx = e.clientX - lookDrag.x, dy = e.clientY - lookDrag.y;
    lookDrag = { x: e.clientX, y: e.clientY };
    const k = FOV_LONG / stageEl.clientHeight;
    if (ar.sensors) ar.userYaw -= dx * k;
    else { ar.yaw -= dx * k; ar.pitch = Math.max(-80 * RAD, Math.min(85 * RAD, ar.pitch + dy * k)); }
  });
  const endLook = () => { lookDrag = null; };
  lookEl.addEventListener("pointerup", endLook);
  lookEl.addEventListener("pointercancel", endLook);
  lookEl.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

  function startCameraStream() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(false);
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => {
      cam.srcObject = stream;
      return cam.play().then(() => { stageEl.classList.add("has-cam"); return true; });
    }).catch(() => false);
  }

  async function startAR() {
    // All three requests start inside the tap itself — iOS only shows permission prompts for a direct user action
    const oriP = (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function")
      ? DeviceOrientationEvent.requestPermission().catch(() => "denied")
      : Promise.resolve("granted");
    const camP = startCameraStream();
    const locP = new Promise(res => {
      if (!navigator.geolocation) { res(null); return; }
      navigator.geolocation.getCurrentPosition(res, () => res(null), { enableHighAccuracy: true, timeout: 10000, maximumAge: 600000 });
    });
    camBtn.disabled = true;
    camBtn.textContent = "Включаю…";
    const [ori, camOk, pos] = await Promise.all([oriP, camP, locP]);

    if (ori === "granted") {
      window.addEventListener("ondeviceorientationabsolute" in window ? "deviceorientationabsolute" : "deviceorientation", onOrientation);
    }
    if (pos) {
      ar.lat = pos.coords.latitude; ar.lon = pos.coords.longitude; pathKey = "";
      ar.decl = magneticDeclination(ar.lat, ar.lon);
    }
    stageEl.classList.add("ar-on");

    setTimeout(() => {
      const missing = [];
      if (!camOk) missing.push("камере");
      if (!pos) missing.push("геолокации");
      if (ori !== "granted") missing.push("датчикам движения");
      const parts = [];
      if (missing.length) parts.push("Нет доступа к " + missing.join(", ") + ".");
      if (!pos) parts.push("Траектория показана для Белграда.");
      if (!ar.sensors) parts.push("Перетаскивайте небо, чтобы осмотреться.");
      if (parts.length) showStatus(parts.join(" "), 8000);
    }, 1200);
  }
  camBtn.addEventListener("click", startAR);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && cam.srcObject) cam.play().catch(() => {});
  });

  // Desktop: scale the 393×852 frame to fit the window
  const stage = document.getElementById("stage");
  function fit() {
    if (window.innerWidth > 500) {
      const s = Math.min(1, (window.innerHeight - 32) / 852, (window.innerWidth - 32) / 393);
      stage.style.transform = "scale(" + s + ")";
    } else {
      stage.style.transform = "";
    }
    [time, day, month].forEach(c => { const i = c.nearest(); c.layout(); c.goTo(i, false); });
  }
  window.addEventListener("resize", fit);

  const start = () => {
    fit(); init(); linking = true;
    // Without sensors, start by looking toward the sun at the selected time
    const sp = sunPosition(selectedDate(), ar.lat, ar.lon);
    ar.yaw = sp.az;
    ar.pitch = Math.max(-10 * RAD, sp.alt - 8 * RAD);
    requestAnimationFrame(frame);
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
